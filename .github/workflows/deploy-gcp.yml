name: Test, build and deploy to GCP

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_reindex:
        description: Rebuild all Vertex AI embeddings after deployment
        required: false
        default: false
        type: boolean

concurrency:
  group: vlegal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build images and deploy production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
      GCP_EMBEDDING_LOCATION: ${{ vars.GCP_EMBEDDING_LOCATION || 'asia-southeast1' }}
      GCP_EMBEDDING_VERTEX_LOCATIONS: ${{ vars.GCP_EMBEDDING_VERTEX_LOCATIONS }}
      GCP_EMBEDDING_VERTEX_REQUESTS_PER_MINUTE: ${{ vars.GCP_EMBEDDING_VERTEX_REQUESTS_PER_MINUTE || '4.5' }}
      GCP_REPOSITORY: ${{ vars.GCP_REPOSITORY || 'vlegal' }}
      GCP_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_RUN_SERVICE_ACCOUNT }}
      GCP_CORPUS_BUCKET: ${{ vars.GCP_CORPUS_BUCKET }}
      GCP_NETWORK: ${{ vars.GCP_NETWORK || 'default' }}
      GCP_SUBNET: ${{ vars.GCP_SUBNET || 'default' }}
      GCP_PUBLIC_FRONTEND_URL: ${{ vars.GCP_PUBLIC_FRONTEND_URL }}
      GCP_WORKER_INSTANCES: ${{ vars.GCP_WORKER_INSTANCES || '0' }}
      GCP_BEAT_INSTANCES: ${{ vars.GCP_BEAT_INSTANCES || '0' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_EMBEDDING_LOCATION
            GCP_REPOSITORY
            GCP_RUN_SERVICE_ACCOUNT
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            NEO4J_URI
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub production variable or secret: ${key}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
       

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/vlegal-backend:${{ env.IMAGE_TAG }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/vlegal-backend:latest
          cache-from: type=gha,scope=vlegal-backend
          cache-to: type=gha,mode=max,scope=vlegal-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/vlegal-frontend:${{ env.IMAGE_TAG }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/vlegal-frontend:latest
          cache-from: type=gha,scope=vlegal-frontend
          cache-to: type=gha,mode=max,scope=vlegal-frontend

      - name: Deploy Cloud Run services, jobs and worker pools
        shell: pwsh
        run: |
          $parameters = @{
            ProjectId = $env:GCP_PROJECT_ID
            Region = $env:GCP_REGION
            EmbeddingLocation = $env:GCP_EMBEDDING_LOCATION
            EmbeddingVertexLocations = $env:GCP_EMBEDDING_VERTEX_LOCATIONS
            EmbeddingVertexRequestsPerMinute = [double]$env:GCP_EMBEDDING_VERTEX_REQUESTS_PER_MINUTE
            Repository = $env:GCP_REPOSITORY
            Tag = $env:IMAGE_TAG
            RunServiceAccount = $env:GCP_RUN_SERVICE_ACCOUNT
            CorpusBucket = $env:GCP_CORPUS_BUCKET
            Network = $env:GCP_NETWORK
            Subnet = $env:GCP_SUBNET
            Neo4jUri = $env:NEO4J_URI
            FrontendUrl = $env:GCP_PUBLIC_FRONTEND_URL
            WorkerInstances = [int]$env:GCP_WORKER_INSTANCES
            BeatInstances = [int]$env:GCP_BEAT_INSTANCES
            Component = "all"
            ExecuteMigrate = $true
          }

          if (
            "${{ github.event_name }}" -eq "workflow_dispatch" -and
            "${{ inputs.run_reindex }}" -eq "true"
          ) {
            $parameters.ExecuteReindex = $true
          }

          ./scripts/gcp/deploy.ps1 @parameters

      - name: Verify production health
        shell: bash
        run: |
          frontend_url="$(
            gcloud run services describe vlegal-frontend \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.url)'
          )"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 15 \
              "${frontend_url}/api/health/ready"; then
              echo
              echo "Production is healthy: ${frontend_url}"
              echo "### Deployment completed" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Commit: \`${IMAGE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Frontend: ${frontend_url}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Production readiness check failed: ${frontend_url}/api/health/ready"
          exit 1
