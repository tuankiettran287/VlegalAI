# Local development stack. Production images are described by compose.gcp.yml
# and deployed by scripts/gcp/deploy.ps1.
name: vlegal

x-backend-image: &backend-image
  image: "${VLEGAL_BACKEND_IMAGE:-vlegal-backend:local}"
  build:
    context: .
    dockerfile: docker/backend.Dockerfile

x-app-environment: &app-environment
  APP_ENV: development
  PUBLIC_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
  RETRIEVER_BACKEND: "${RETRIEVER_BACKEND:-hybrid_rag}"
  POSTGRES_VECTOR_SIZE: "${POSTGRES_VECTOR_SIZE:-1024}"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: "${NEO4J_USER:-neo4j}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:-local-neo4j-password}"
  NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
  GEMINI_CREDENTIALS_PATH: /app/env.json
  GEMINI_USE_ADC: "${GEMINI_USE_ADC:-true}"
  GEMINI_PROJECT_ID: "${GEMINI_PROJECT_ID:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
  GEMINI_LOCATION: "${GEMINI_LOCATION:-global}"
  GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-low}"
  GEMINI_DATA_POLICY: "${GEMINI_DATA_POLICY:-redact}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-gemini-embedding-001}"
  EMBEDDING_LOCATION: "${EMBEDDING_LOCATION:-asia-southeast1}"
  EMBEDDING_MAX_CONCURRENCY: "${EMBEDDING_MAX_CONCURRENCY:-8}"
  EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-60}"
  EMBEDDING_MAX_RETRIES: "${EMBEDDING_MAX_RETRIES:-3}"
  EMBEDDING_AUTO_TRUNCATE: "${EMBEDDING_AUTO_TRUNCATE:-true}"

x-runtime-volumes: &runtime-volumes
  - ./env.json:/app/env.json:ro

services:
  migrate:
    <<: *backend-image
    command: [alembic, upgrade, head]
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    restart: "no"

  reindex:
    <<: *backend-image
    command:
      - python
      - scripts/sync_external_graphrag.py
      - --reset-neo4j
      - --reset-postgres
    profiles: [jobs]
    env_file:
      - .env
    environment:
      <<: *app-environment
      LEGAL_DATA_DIR: /app/legal-data
      LEGAL_STORAGE_DIR: /app/storage/graphrag
      LEGAL_GRAPHRAG_DB: /app/storage/graphrag/legal_graphrag.sqlite
    volumes:
      - ./env.json:/app/env.json:ro
      - "./Data (1):/app/legal-data:ro"
      - ./storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *runtime-volumes
    ports:
      - "${API_PORT:-8000}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8080/api/health/live", timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: "${VLEGAL_FRONTEND_IMAGE:-vlegal-frontend:local}"
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:8080
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend-image
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
      - "--concurrency=${CELERY_CONCURRENCY:-1}"
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *runtime-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *backend-image
    command:
      - celery
      - -A
      - app.scheduler.celery_app
      - beat
      - --loglevel=INFO
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-local-neo4j-password}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
    volumes:
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
