# Local development stack only. Google Cloud Run does not deploy Compose files;
# use compose.gcp.yml to build/tag images and scripts/gcp/deploy.ps1 to deploy.
name: vlegal

# Cấu hình dùng chung cho api và worker. Cả hai truy hồi qua PostgreSQL/pgvector
# và Neo4j, không mở chỉ mục SQLite cục bộ và không đọc corpus .docx, nên ở đây
# không có LEGAL_DATA_DIR/LEGAL_STORAGE_DIR/LEGAL_GRAPHRAG_DB — xem service
# reindex, nơi duy nhất dùng tới chúng.
x-app-environment: &app-environment
  APP_ENV: development
  PUBLIC_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
  RETRIEVER_BACKEND: "${RETRIEVER_BACKEND:-hybrid_rag}"
  POSTGRES_VECTOR_SIZE: "${POSTGRES_VECTOR_SIZE:-1024}"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: "${NEO4J_USER:-neo4j}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:-local-neo4j-password}"
  NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
  GEMINI_CREDENTIALS_PATH: /app/env.json
  # Bearer token chỉ được gắn vào request Vertex khi cờ này bật; để false trong
  # khi vẫn mount service account ở /app/env.json sẽ nhận HTTP 401.
  GEMINI_USE_ADC: "${GEMINI_USE_ADC:-true}"
  GEMINI_PROJECT_ID: "${GEMINI_PROJECT_ID:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
  GEMINI_LOCATION: "${GEMINI_LOCATION:-global}"
  GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-low}"
  GEMINI_DATA_POLICY: "${GEMINI_DATA_POLICY:-redact}"
  EMBEDDING_MODEL_PATH: /models/embedding
  EMBEDDING_MODEL_REPO: "${EMBEDDING_MODEL_REPO:-BAAI/bge-m3}"
  EMBEDDING_MODEL_REVISION: "${EMBEDDING_MODEL_REVISION:-main}"
  EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-auto}"

x-runtime-volumes: &runtime-volumes
  - ./env.json:/app/env.json:ro
  - embedding_model:/models/embedding:ro

services:
  model-init:
    image: "${VLEGAL_MODEL_INIT_IMAGE:-vlegal-model-init:local}"
    build:
      context: .
      dockerfile: docker/model-init.Dockerfile
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      EMBEDDING_MODEL_PATH: /models/embedding
      EMBEDDING_MODEL_REPO: "${EMBEDDING_MODEL_REPO:-BAAI/bge-m3}"
      EMBEDDING_MODEL_REVISION: "${EMBEDDING_MODEL_REVISION:-main}"
    volumes:
      - embedding_model:/models/embedding
    restart: "no"

  migrate:
    image: "${VLEGAL_MIGRATE_IMAGE:-vlegal-migrate:local}"
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    restart: "no"

  # Service duy nhất đọc corpus .docx và ghi chỉ mục GraphRAG: dựng SQLite từ
  # /app/legal-data rồi đẩy node/edge/chunk sang Neo4j và pgvector.
  reindex:
    image: "${VLEGAL_REINDEX_IMAGE:-vlegal-reindex:local}"
    build:
      context: .
      dockerfile: docker/reindex.Dockerfile
    profiles: [jobs]
    env_file:
      - .env
    environment:
      <<: *app-environment
      LEGAL_DATA_DIR: /app/legal-data
      LEGAL_STORAGE_DIR: /app/storage/graphrag
      LEGAL_GRAPHRAG_DB: /app/storage/graphrag/legal_graphrag.sqlite
    volumes:
      - embedding_model:/models/embedding:ro
      - "./Data (1):/app/legal-data:ro"
      - ./storage:/app/storage
    depends_on:
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    image: "${VLEGAL_API_IMAGE:-vlegal-api:local}"
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *runtime-volumes
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: "${VLEGAL_FRONTEND_IMAGE:-vlegal-frontend:local}"
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:8080
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: "${VLEGAL_WORKER_IMAGE:-vlegal-worker:local}"
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-1}"
    volumes: *runtime-volumes
    depends_on:
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: "${VLEGAL_BEAT_IMAGE:-vlegal-beat:local}"
    build:
      context: .
      dockerfile: docker/beat.Dockerfile
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-local-neo4j-password}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
    volumes:
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  embedding_model:
  neo4j_data:
