# Optional container stack for reproducing the production image.
#
# Docker Compose reads .env for ${...} interpolation and injects it into every
# backend process through env_file. The file is intentionally never copied into
# an image. The Google service-account JSON is mounted as a read-only Compose
# secret at /run/secrets/gcp_credentials.
name: vlegal

x-app-image: &app-image
  image: "${VLEGAL_APP_IMAGE:-vlegal-app:local}"
  build:
    context: .
    dockerfile: docker/app.Dockerfile

x-app-environment: &app-environment
  APP_ENV: "${APP_ENV:-development}"
  PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8000}"
  FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8000}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"

  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
  RETRIEVER_BACKEND: "${RETRIEVER_BACKEND:-hybrid_rag}"
  POSTGRES_VECTOR_SIZE: "${POSTGRES_VECTOR_SIZE:-1024}"

  NEO4J_URI: "${NEO4J_URI:?Set NEO4J_URI in .env}"
  NEO4J_USER: "${NEO4J_USER:?Set NEO4J_USER in .env}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
  NEO4J_DATABASE: "${NEO4J_DATABASE:?Set NEO4J_DATABASE in .env}"

  # Both the application and google-auth can discover the same read-only
  # credential. On Cloud Run these paths are replaced by the runtime identity.
  GEMINI_CREDENTIALS_PATH: /run/secrets/gcp_credentials
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_credentials
  GEMINI_USE_ADC: "${GEMINI_USE_ADC:-true}"
  GEMINI_PROJECT_ID: "${GEMINI_PROJECT_ID:?Set GEMINI_PROJECT_ID in .env}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
  GEMINI_LOCATION: "${GEMINI_LOCATION:-global}"
  GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-low}"
  GEMINI_DATA_POLICY: "${GEMINI_DATA_POLICY:-redact}"
  QUERY_REWRITE_ENABLED: "${QUERY_REWRITE_ENABLED:-true}"
  QUERY_REWRITE_TIMEOUT_SECONDS: "${QUERY_REWRITE_TIMEOUT_SECONDS:-12}"
  QUERY_REWRITE_MIN_CONFIDENCE: "${QUERY_REWRITE_MIN_CONFIDENCE:-0.75}"

  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-vertex}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-gemini-embedding-001}"
  EMBEDDING_LOCATION: "${EMBEDDING_LOCATION:-global}"
  EMBEDDING_MAX_CONCURRENCY: "${EMBEDDING_MAX_CONCURRENCY:-8}"
  EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-20}"
  EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-60}"
  EMBEDDING_MAX_RETRIES: "${EMBEDDING_MAX_RETRIES:-3}"
  EMBEDDING_AUTO_TRUNCATE: "${EMBEDDING_AUTO_TRUNCATE:-true}"
  EMBEDDING_VERTEX_LOCATIONS: "${EMBEDDING_VERTEX_LOCATIONS:-}"
  EMBEDDING_VERTEX_REQUESTS_PER_MINUTE: "${EMBEDDING_VERTEX_REQUESTS_PER_MINUTE:-0}"

x-app-service: &app-service
  <<: *app-image
  init: true
  env_file:
    - path: ./.env
      required: true
  environment: *app-environment
  secrets:
    - source: gcp_credentials
      target: gcp_credentials

services:
  migrate:
    <<: *app-service
    command: [python, -m, alembic, upgrade, head]
    restart: "no"

  reindex:
    <<: *app-service
    command:
      - python
      - scripts/sync_external_graphrag.py
      - --reset-neo4j
      - --reset-postgres
    profiles: [jobs]
    environment:
      <<: *app-environment
      LEGAL_DATA_DIR: /app/legal-data
      LEGAL_STORAGE_DIR: /app/storage/graphrag
      LEGAL_GRAPHRAG_DB: /app/storage/graphrag/legal_graphrag.sqlite
    volumes:
      - type: bind
        source: "./data/legal-documents"
        target: /app/legal-data
        read_only: true
      - type: bind
        source: ./storage
        target: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *app-service
    ports:
      - "${API_PORT:-8000}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8080/api/health/live", timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    restart: unless-stopped

  worker:
    <<: *app-service
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
      - "--concurrency=${CELERY_CONCURRENCY:-1}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  beat:
    <<: *app-service
    command:
      - celery
      - -A
      - app.scheduler.celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

secrets:
  gcp_credentials:
    file: "${GCP_CREDENTIALS_FILE:-./env.json}"
