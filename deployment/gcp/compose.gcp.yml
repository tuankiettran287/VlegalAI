# Build/tag manifest for Google Artifact Registry.
# The web service, worker pools and jobs all reuse one immutable commit image.
name: vlegal-gcp

x-build: &build
  pull_policy: build

services:
  app:
    <<: *build
    image: "${GCP_REGION:-asia-southeast1}-docker.pkg.dev/${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}/${GCP_REPOSITORY:-vlegal}/vlegal-app:${IMAGE_TAG:-latest}"
    build:
      context: ../..
      dockerfile: docker/app.Dockerfile
      args:
        VCS_REF: "${IMAGE_TAG:-latest}"
      platforms:
        - linux/amd64
